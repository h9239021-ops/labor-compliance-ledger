<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근로감독 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style id="app-style">
  :root{
    --ink-900:#1c2430; --ink-700:#3d4756; --ink-500:#6b7685; --ink-300:#9aa3af;
    --paper-0:#f5f7fa; --paper-50:#fafbfc; --surface:#ffffff;
    --line:#e3e7ee; --line-soft:#eef1f5;
    --accent-900:#0b3d6e; --accent-700:#0072ce; --accent-500:#2b8be0; --accent-100:#e3effb; --accent-050:#f1f7fd;
    --danger-700:#c62828; --danger-100:#fdecec;
    --warn-700:#a86400;  --warn-100:#fdf3e1;
    --good-700:#2e7d32;  --good-100:#e8f4ea;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px -6px rgba(16,24,40,.10);
    --font-body:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --font-display:var(--font-body);
    --font-mono:'JetBrains Mono','Roboto Mono',ui-monospace,Consolas,monospace;
    --logo-filter:none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink-900:#e8ecf1; --ink-700:#c3cad4; --ink-500:#8f99a6; --ink-300:#66707c;
      --paper-0:#13171d; --paper-50:#181d24; --surface:#1d232b;
      --line:#2b323d; --line-soft:#232a33;
      --accent-900:#9cc8f0; --accent-700:#4ea4ec; --accent-500:#3a8fd6; --accent-100:#16304a; --accent-050:#152536;
      --danger-700:#ff8a80; --danger-100:#3a1f1f;
      --warn-700:#f2c26b;  --warn-100:#3a2e17;
      --good-700:#8fd19a;  --good-100:#1d3322;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
      --logo-filter:invert(1);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink-900:#e8ecf1; --ink-700:#c3cad4; --ink-500:#8f99a6; --ink-300:#66707c;
    --paper-0:#13171d; --paper-50:#181d24; --surface:#1d232b;
    --line:#2b323d; --line-soft:#232a33;
    --accent-900:#9cc8f0; --accent-700:#4ea4ec; --accent-500:#3a8fd6; --accent-100:#16304a; --accent-050:#152536;
    --danger-700:#ff8a80; --danger-100:#3a1f1f;
    --warn-700:#f2c26b;  --warn-100:#3a2e17;
    --good-700:#8fd19a;  --good-100:#1d3322;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
    --logo-filter:invert(1);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{scroll-padding-top:80px;}
  body{margin:0;background:var(--paper-0);color:var(--ink-900);font-family:var(--font-body);font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent-100);}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;color:var(--ink-900);}
  a{color:var(--accent-700);}
  button{font-family:var(--font-body);}
  table{border-collapse:collapse;}
  .num, time, .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .scrollx{overflow-x:auto;}
  :focus-visible{outline:2px solid var(--accent-500);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  .hint{color:var(--ink-500);}

  /* ===== shell ===== */
  .hd{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);}
  .hd-in{max-width:1480px;margin:0 auto;height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;}
  .brand{display:flex;align-items:center;gap:12px;color:var(--ink-900);text-decoration:none;flex:none;}
  .brand img{height:18px;width:auto;display:block;filter:var(--logo-filter);}
  .brand .sep{width:1px;height:16px;background:var(--line);}
  .brand .nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em;}
  .gnb{display:flex;gap:2px;height:100%;overflow-x:auto;}
  .gnb a{display:flex;align-items:center;height:100%;padding:0 12px;font-weight:600;font-size:14px;color:var(--ink-700);border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap;}
  .gnb a:hover{color:var(--accent-700);}
  .gnb a.on{color:var(--accent-700);border-bottom-color:var(--accent-700);}
  .hd-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;}
  .who{font-size:12px;color:var(--ink-500);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-900);border-radius:8px;height:34px;width:38px;cursor:pointer;font-size:17px;}
  .wrap{max-width:1480px;margin:0 auto;display:flex;min-height:calc(100vh - 62px);}
  .side{width:272px;flex:none;border-right:1px solid var(--line);background:var(--paper-50);position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;padding:20px 12px 40px;}
  .side-title{font-size:11.5px;font-weight:700;color:var(--ink-300);letter-spacing:.05em;padding:0 10px 6px;}
  .side-sec{font-size:15.5px;font-weight:700;padding:0 10px 12px;color:var(--ink-900);}
  .grp{margin-bottom:2px;}
  .grp-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--ink-900);cursor:pointer;text-align:left;}
  .grp-h:hover{background:var(--paper-0);}
  .grp-h .chev{color:var(--ink-300);transition:transform .15s;font-size:10px;}
  .grp.open .grp-h .chev{transform:rotate(90deg);}
  .grp ul{list-style:none;margin:0 0 6px;padding:0 0 0 10px;display:none;}
  .grp.open ul{display:block;}
  .grp li a{display:block;padding:5px 10px 5px 12px;border-left:2px solid var(--line-soft);font-size:13px;color:var(--ink-500);line-height:1.5;text-decoration:none;}
  .grp li a:hover{color:var(--ink-900);border-left-color:var(--ink-300);}
  .grp li a.on{color:var(--accent-700);font-weight:700;border-left-color:var(--accent-700);background:var(--accent-050);}
  .side-link{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink-700);font-weight:600;font-size:13.5px;text-decoration:none;}
  .side-link:hover{background:var(--paper-0);}
  .side-link.on{background:var(--accent-050);color:var(--accent-700);}
  .main{flex:1;min-width:0;padding:28px 36px 80px;}
  .main.narrow{display:flex;justify-content:center;}
  .page{max-width:1180px;margin:0 auto;}
  .scrim{display:none;}
  @media (max-width:980px){
    .menu-btn{display:inline-block;}
    .gnb{display:none;}
    .who{display:none;}
    .side{position:fixed;left:0;top:62px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);background:var(--surface);}
    body.nav-open .side{transform:none;}
    body.nav-open .scrim{display:block;position:fixed;inset:62px 0 0 0;background:rgba(0,0,0,.3);z-index:30;}
    .main{padding:20px 14px 60px;}
    .m-gnb{display:flex !important;}
  }
  .m-gnb{display:none;flex-wrap:wrap;gap:6px;padding:0 6px 14px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .m-gnb a{flex:1 1 40%;text-align:center;padding:7px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-700);background:var(--paper-0);text-decoration:none;}
  .m-gnb a.on{background:var(--accent-700);color:#fff;}
  @media (max-width:560px){ .hd-in{padding:0 12px;gap:10px;} .brand .sep,.brand .nm{display:none;} }

  /* ===== doc (manual body) ===== */
  .doc-wrap{display:flex;justify-content:center;}
  .doc{width:100%;max-width:900px;font-size:15px;line-height:1.7;}
  .toc-r{width:200px;flex:none;position:sticky;top:90px;align-self:flex-start;margin-left:36px;font-size:12.5px;display:none;}
  .toc-r h4{margin:0 0 8px;font-size:12px;color:var(--ink-300);}
  .toc-r a{display:block;color:var(--ink-500);padding:4px 0 4px 10px;border-left:2px solid var(--line-soft);line-height:1.45;text-decoration:none;cursor:pointer;}
  .toc-r a.on{color:var(--accent-700);border-left-color:var(--accent-700);font-weight:600;}
  @media (min-width:1300px){ .toc-r{display:block;} }
  .crumb{font-size:12.5px;color:var(--ink-300);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;}
  .crumb a{color:var(--ink-500);text-decoration:none;}
  .doc h1{font-size:29px;line-height:1.35;letter-spacing:-.02em;margin:0 0 10px;}
  .doc .lead{font-size:16px;color:var(--ink-700);margin:0 0 20px;}
  .doc .meta-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 24px;padding-bottom:20px;border-bottom:1px solid var(--line);}
  .doc h2{font-size:20px;letter-spacing:-.015em;margin:38px 0 12px;}
  .doc h3{font-size:16px;margin:24px 0 8px;}
  .doc p{margin:0 0 12px;color:var(--ink-700);}
  .doc ul.dot,.doc ol.num{margin:0 0 14px;padding-left:22px;color:var(--ink-700);}
  .doc ul.dot li,.doc ol.num li{margin:4px 0;}
  .doc ul.check{list-style:none;margin:0 0 14px;padding:0;}
  .doc ul.check li{position:relative;padding-left:26px;margin:6px 0;color:var(--ink-700);}
  .doc ul.check li::before{content:"✓";position:absolute;left:4px;top:0;color:var(--accent-700);font-weight:800;}
  .doc b,.doc strong{color:var(--ink-900);}
  .doc .red{color:var(--danger-700)!important;}
  .doc .blue{color:var(--accent-700)!important;}
  .doc .note{border-radius:10px;padding:14px 16px 14px 46px;margin:16px 0;position:relative;background:var(--accent-050);border:1px solid var(--accent-100);color:var(--ink-700);font-size:14.5px;}
  .doc .note::before{position:absolute;left:16px;top:13px;font-size:16px;}
  .doc .note.info::before{content:"ⓘ";color:var(--accent-700);font-weight:800;}
  .doc .note.tip{background:var(--good-100);border-color:transparent;}.doc .note.tip::before{content:"✓";color:var(--good-700);font-weight:800;}
  .doc .note.warn{background:var(--warn-100);border-color:transparent;}.doc .note.warn::before{content:"⚠";color:var(--warn-700);}
  .doc .note.danger{background:var(--danger-100);border-color:transparent;}.doc .note.danger::before{content:"⚠";color:var(--danger-700);}
  .doc .note .nt{display:block;font-weight:700;color:var(--ink-900);margin-bottom:4px;}
  .doc .note ul{margin:4px 0 0;padding-left:18px;}
  .doc .tbl-w{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--line);border-radius:10px;}
  .doc table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:560px;}
  .doc table.t th{background:var(--paper-0);text-align:left;font-weight:700;color:var(--ink-900);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;}
  .doc table.t td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-700);}
  .doc table.t tr:last-child td{border-bottom:0;}
  .doc table.t td.k{font-weight:700;color:var(--ink-900);white-space:nowrap;}
  .doc table.t td.c,.doc table.t th.c{text-align:center;}
  .doc table.t td.mono{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap;}
  .doc .steps{list-style:none;margin:14px 0 20px;padding:0;counter-reset:s;}
  .doc .steps li{position:relative;padding:0 0 18px 46px;counter-increment:s;}
  .doc .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent-700);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .doc .steps li::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line);}
  .doc .steps li:last-child::after{display:none;}
  .doc .steps li b{display:block;color:var(--ink-900);font-size:15px;}
  .doc .steps li span{color:var(--ink-700);font-size:14px;}
  .doc .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:14px 0 20px;}
  .doc .card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);}
  .doc .card h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .doc .card h4 .n{width:24px;height:24px;border-radius:7px;background:var(--accent-100);color:var(--accent-700);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .doc .card p,.doc .card li{font-size:13.5px;color:var(--ink-700);margin:0;}
  .doc .card ul{margin:0;padding-left:16px;}
  .doc .card.green{border-color:transparent;background:var(--good-100);}
  .doc .card.orange{border-color:transparent;background:var(--warn-100);}
  .doc .card.red{border-color:transparent;background:var(--danger-100);}
  .doc .card.blue{border-color:transparent;background:var(--accent-050);}
  .doc .flow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px;}
  .doc .flow .f{flex:1;min-width:130px;background:var(--accent-050);border:1px solid var(--accent-100);border-radius:10px;padding:10px 12px;}
  .doc .flow .f b{display:block;font-size:14px;color:var(--accent-900);}
  .doc .flow .f small{display:block;font-size:12.5px;color:var(--ink-500);line-height:1.5;margin-top:2px;}
  .doc .tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:100px;background:var(--paper-0);color:var(--ink-500);border:1px solid var(--line);}
  .doc .tag.b{background:var(--accent-100);color:var(--accent-900);border-color:transparent;}
  .doc .tag.r{background:var(--danger-100);color:var(--danger-700);border-color:transparent;}
  .doc .refs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:30px 0 0;padding:14px 16px;border-radius:10px;background:var(--paper-0);font-size:13px;}
  .doc .refs .lb{font-weight:700;color:var(--ink-900);margin-right:4px;}
  .doc .refs a{display:inline-flex;gap:4px;padding:3px 10px;border-radius:100px;background:var(--surface);border:1px solid var(--line);color:var(--ink-700);font-size:12.5px;text-decoration:none;}
  .doc .refs a:hover{border-color:var(--accent-700);color:var(--accent-700);}
  .doc details.acc{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--surface);}
  .doc details.acc>summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .doc details.acc>summary::-webkit-details-marker{display:none;}
  .doc details.acc .acc-b{padding:0 16px 14px;}
  .doc .chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px;}
  .doc .chk label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-700);line-height:1.55;}
  .doc .pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line);}
  .doc .pn a{border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink-900);text-decoration:none;}
  .doc .pn a:hover{border-color:var(--accent-700);}
  .doc .pn a small{display:block;font-size:12px;color:var(--ink-300);margin-bottom:2px;}
  .doc .pn a.nx{text-align:right;grid-column:2;}
  .doc-editor textarea{width:100%;min-height:420px;font-family:var(--font-mono);font-size:12.5px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-900);}
  @media (max-width:560px){ .doc .pn{grid-template-columns:1fr;} .doc .pn a.nx{grid-column:1;} .doc h1{font-size:24px;} }

  /* ===== components (ledger + new modules) ===== */
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-900);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;}
  .btn:hover{border-color:var(--accent-500);color:var(--accent-700);}
  .btn.primary{background:var(--accent-700);border-color:var(--accent-700);color:#fff;}
  .btn.primary:hover{background:var(--accent-900);border-color:var(--accent-900);color:#fff;}
  .btn.danger{color:var(--danger-700);}
  .btn.danger:hover{border-color:var(--danger-700);}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.01em;white-space:nowrap;flex:none;}
  .badge.good{background:var(--good-100);color:var(--good-700);}
  .badge.warn{background:var(--warn-100);color:var(--warn-700);}
  .badge.danger{background:var(--danger-100);color:var(--danger-700);}
  .badge.neutral{background:var(--paper-0);color:var(--ink-500);border:1px solid var(--line);}
  .badge.info{background:var(--accent-100);color:var(--accent-700);}
  span.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;display:inline-block;}
  .doc ul.dot{width:auto;height:auto;border-radius:0;background:none;}

  /* manual WYSIWYG editor */
  .ed-bar{position:sticky;top:62px;z-index:20;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 10px;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
  .ed-bar button{border:1px solid var(--line);background:var(--surface);color:var(--ink-900);border-radius:7px;padding:5px 9px;font-size:12.5px;cursor:pointer;font-family:var(--font-body);}
  .ed-bar button:hover{border-color:var(--accent-500);color:var(--accent-700);}
  .ed-bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;}
  .ed-bar .grow{flex:1;}
  .doc [contenteditable="true"]{outline:2px dashed var(--accent-100);outline-offset:6px;border-radius:4px;}
  .doc [contenteditable="true"]:focus{outline-color:var(--accent-500);}
  .ed-hint{font-size:12px;color:var(--ink-500);margin:-6px 0 14px;}
  .ed-html{width:100%;min-height:420px;font-family:var(--font-mono);font-size:12.5px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-900);}
  .ed-refs{display:flex;gap:8px;align-items:center;margin-top:20px;font-size:13px;color:var(--ink-500);}
  .ed-refs input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-900);}

  /* response table wrapping */
  .resp-title{min-width:240px;max-width:460px;white-space:normal;overflow-wrap:anywhere;}
  .wraptext{white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all;}
  .modal textarea{min-height:110px;resize:vertical;line-height:1.55;white-space:pre-wrap;}

  .banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;margin:16px 0;}
  .banner.warn{background:var(--warn-100);border-color:transparent;color:var(--warn-700);}
  .banner.info{background:var(--accent-050);border-color:transparent;color:var(--accent-900);}
  .banner.danger{background:var(--danger-100);border-color:transparent;color:var(--danger-700);}

  section.view{display:none;}
  section.view.active{display:block;}

  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:8px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
  .stat .label{font-size:12px;color:var(--ink-500);font-weight:600;letter-spacing:.02em;}
  .stat .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--ink-900);}
  .stat .value small{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-500);margin-left:4px;}
  .stat .sub{font-size:12px;color:var(--ink-500);margin-top:4px;}
  .stat.flag{border-color:var(--danger-700);}
  .stat.flag .value{color:var(--danger-700);}
  .stat-dual{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
